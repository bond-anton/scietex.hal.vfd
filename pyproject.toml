[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scietex.hal.vfd"
dynamic = ["version"]
description = "Scietex VFD HAL package"
authors = [
  { name = "Anton Bondarenko", email = "bond.anton@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "msgspec[yaml] ~= 0.20.0",
    "scietex.hal.serial >= 2.5.0, < 3.0.0",
    "pymodbus >=3.15,<3.16",
]

[project.entry-points."scietex.hal.vfd.drivers"]
intek_spe_b_modbus = "scietex.hal.vfd.intek.spe_b:IntekSPEBModbusVFD"
vesper_e5_8200_modbus = "scietex.hal.vfd.vesper.e5_8200:VesperE58200ModbusVFD"
vesper_e4_8400_modbus = "scietex.hal.vfd.vesper.e4_8400:VesperE48400ModbusVFD"

[project.urls]
"Homepage" = "https://github.com/bond-anton/scietex.hal.vfd"
"Bug Tracker" = "https://github.com/bond-anton/scietex.hal.vfd/issues"

[project.optional-dependencies]
dev = ["tox>=4.46.0"]
test = ["pytest", "pytest-asyncio", "pytest-xdist"]
lint = ["ruff", "ty"]

[tool.setuptools.dynamic]
version = {attr = "scietex.hal.vfd.version.__version__"}

[tool.setuptools.package-data]
"scietex.hal.vfd" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
